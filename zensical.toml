[project]
site_name = "Dimplex Hub Integration"
site_description = "Home Assistant integration for Glen Dimplex Heating & Ventilation appliances"
site_author = "KRoperUK"
site_url = "https://dimplex-hass.kroper.uk/"
copyright = "Copyright &copy; 2026 KRoperUK — an unofficial project, not affiliated with or endorsed by Dimplex or Glen Dimplex Heating &amp; Ventilation"

# Turn zensical's link and anchor warnings into build failures. It already
# detected these; without `strict` the docs workflow published anyway, and a dead
# link to index.md#energy-monitoring shipped for months.
strict = true

repo_url = "https://github.com/KRoperUK/dimplex-controller-hass"
repo_name = "KRoperUK/dimplex-controller-hass"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "start/index.md",
    { "Connect your account" = "start/connect.md" },
  ] },
  { "Using it" = [
    { "Modes & presets" = "use/modes.md" },
    { "Temperature & schedules" = "use/temperature.md" },
    { "Energy monitoring" = "use/energy.md" },
    { "Automations & blueprints" = "use/automations.md" },
  ] },
  { "Reference" = [
    { "Entities" = "reference/entities.md" },
    { "Actions" = "reference/actions.md" },
    { "Options" = "reference/options.md" },
    { "Appliance support" = "reference/appliances.md" },
  ] },
  { "Help" = [
    { "Troubleshooting" = "help/troubleshooting.md" },
    { "Diagnostics & bug reports" = "help/diagnostics.md" },
    { "Upgrading" = "help/upgrading.md" },
  ] },
  { "Internals" = [
    { "Multi-account" = "internals/multi-account.md" },
    { "Dev & pre-release builds" = "internals/dev-releases.md" },
    { "Design specs" = [
      "internals/specs/2026-07-13-dev-semver-pre-releases-design.md",
    ] },
  ] },
]

# The 4.1.0 restructure moved every page. Without these, links from release
# notes, issue comments and the HACS listing all 404. Redirects are page-level,
# so a link to an old anchor lands at the top of the new page.
[project.plugins.redirects.redirect_maps]
"getting-started.md" = "start/index.md"
"configuration.md" = "reference/options.md"
"entities.md" = "reference/entities.md"
"advanced.md" = "reference/actions.md"
"troubleshooting.md" = "help/troubleshooting.md"
"multi-config.md" = "internals/multi-account.md"
"superpowers/specs/2026-07-13-dev-semver-pre-releases-design.md" = "internals/specs/2026-07-13-dev-semver-pre-releases-design.md"

[project.theme]
# Pinned explicitly: `docs.yml` installs zensical unpinned, and `variant` is a
# defaulted setting, so an upstream default change would silently restyle the
# whole site mid-release.
variant = "modern"
custom_dir = "overrides"
language = "en"
logo = "assets/brand/logo.png"
favicon = "assets/brand/icon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Brand crimson (#d62945) lives in docs/stylesheets/extra.css; "custom" is what
# tells the theme to read those CSS variables instead of a named palette.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
# Bumped by release-please via its `generic` updater; asserted equal to
# manifest.json by scripts/check-docs-coverage.sh so it cannot drift silently.
integration_version = "4.1.0" # x-release-please-version

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KRoperUK/dimplex-controller-hass"

[[project.extra.social]]
icon = "simple/homeassistant"
link = "https://my.home-assistant.io/redirect/hacs_repository/?owner=KRoperUK&repository=dimplex-controller-hass&category=integration"
name = "Install via HACS"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.snippets]
# Glossary definitions appended to every page, so `content.tooltips` can render
# a hover definition for the Dimplex vocabulary wherever a term appears.
#
# Kept outside docs/ deliberately: zensical 0.0.62 has no `exclude_docs`, so any
# .md inside the docs root is published as a page of its own.
auto_append = ["includes/glossary.md"]
base_path = ["."]

[project.markdown_extensions.pymdownx.superfences]
# Declaring superfences at all replaces zensical's default `custom_fences`
# rather than merging with it, which silently disabled mermaid: a ```mermaid
# block rendered as a plain code block. Restore the default explicitly.
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
