[tool.ruff]
# Deliberately the oldest Python we must stay loadable on, or older — never
# newer. The hacs.json floor of Home Assistant 2026.9.0 requires Python >=3.14.2,
# so py314 would be permissible; it is not used because ruff's formatter would
# then rewrite `except (TypeError, ValueError)` to the PEP 758 form
# `except TypeError, ValueError`, which reads like Python 2's `except E, name:`
# binding and is a needless trap for contributors. py312 costs only 3.13/3.14
# pyupgrade rewrites. tests/test_python_floor.py enforces the ceiling: this may
# never exceed the Python implied by the hacs.json floor, or the integration
# ships syntax the oldest supported Home Assistant cannot parse.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
 ]
# E501 (line length) is handled by the formatter; long strings/comments are fine.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.mypy]
# Strict typing for the integration package; CI runs `mypy` on this path.
# Deliberately NOT the ruff target-version above: mypy has to parse the installed
# Home Assistant, and HA 2026.9 uses PEP 758 `except` syntax, so anything below
# 3.14 fails to parse homeassistant itself before it reaches our code.
python_version = "3.14"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
# Scope to our own package; Home Assistant is imported for types only.
files = ["custom_components/dimplex"]

[tool.pytest.ini_options]
addopts = "-qq --cov=custom_components.dimplex --cov-report=term-missing"
console_output_style = "count"
asyncio_mode = "auto"

[tool.coverage.run]
branch = false
source = ["custom_components/dimplex"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
