# Managed by .github/workflows/sync-labels.yml (EndBug/label-sync).
# CI status labels are applied/removed by .github/workflows/pr-status-labels.yml.
#
# Only labels something actually applies belong here. The stock `duplicate`,
# `good first issue`, `help wanted`, `invalid` and `wontfix` were removed: nothing
# set them, a maintainer triaging a one-maintainer repository can label by hand,
# and they crowded the picker on every new issue (#202). `question` is kept
# deliberately — Discussions is off, so it is the only way to mark a
# question-shaped issue as such.
#
# Note that sync-labels.yml runs with `delete-other-labels: true`, so a label removed
# here is removed from the repository on the next sync. That is how the five stock
# labels above actually went away — with it false, pruning this file left them on
# every issue and PR picker until someone deleted them by hand (dimplex-controller-hass#202).

# --- Conventional issue / PR labels ---
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: question
  color: "d876e3"
  description: Further information is requested
- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency file
- name: python
  color: "2b67c6"
  description: Pull requests that update Python code
- name: github_actions
  color: "000000"
  description: Pull requests that update GitHub Actions code

# --- Release Please ---
- name: "autorelease: pending"
  color: "ededed"
  description: Release-please is preparing a release
- name: "autorelease: tagged"
  color: "ededed"
  description: Release-please has tagged a release

# --- CI status (managed by pr-status-labels workflow) ---
- name: ci-success
  color: "0e8a16"
  description: All required CI checks passed
- name: ci-error
  color: "b60205"
  description: One or more required CI checks failed
- name: test-success
  color: "0e8a16"
  description: Test job passed
- name: test-failure
  color: "d93f0b"
  description: Test job failed
- name: lint-success
  color: "0e8a16"
  description: Lint / pre-commit jobs passed
- name: lint-failure
  color: "d93f0b"
  description: Lint / pre-commit jobs failed
- name: ready-to-merge
  color: "0e8a16"
  description: CI green and PR is mergeable
- name: dev-release-cut
  color: "5319e7"
  description: A dev/RC pre-release was published for this PR or main
- name: needs-attention
  color: "fbca04"
  description: CI failed or PR is not mergeable
