name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches the integration itself. Non-impacting changes
  # (docs, README, other workflows, etc.) skip the heavy jobs below to save compute
  # and avoid minting a dev build. Mergeability is controlled by the aggregate `ci`
  # job (always runs), not by the path-filtered jobs themselves — skipped required
  # checks would otherwise block docs-only and release-please PRs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component: ${{ steps.filter.outputs.component }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            component:
              - 'custom_components/**'
              - 'tests/**'
              - 'scripts/**'
              - 'blueprints/**'
              - 'pyproject.toml'
              - 'requirements_test.txt'
              - 'hacs.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/hacs-release-asset-repair.yml'
            docs:
              - 'docs/**'
              - 'includes/**'
              - 'overrides/**'
              - 'zensical.toml'
              - 'requirements_docs.txt'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - '.github/**/*.md'
              - 'custom_components/dimplex/services.yaml'
              # services.py too, not just the yaml: the action handlers and their
              # schemas are what docs/reference/actions.md documents, and a PR that
              # only touched the handlers would have skipped the docs gate entirely.
              - 'custom_components/dimplex/services.py'
              - 'custom_components/dimplex/const.py'
              - 'custom_components/dimplex/*sensor.py'
              - 'custom_components/dimplex/switch.py'
              - 'custom_components/dimplex/climate.py'
              - 'scripts/check-docs-coverage.sh'
              - 'scripts/check-md-alerts.sh'
              - '.github/workflows/ci.yml'

  # Documentation gate. Two cheap checks that between them would have caught most
  # of the drift audited in #175:
  #
  #   * `zensical build` with `strict = true` fails on a broken internal link or a
  #     missing heading anchor. Zensical already detected these and printed a
  #     warning; without strict the workflow published anyway, and a dead link to
  #     index.md#energy-monitoring shipped for months.
  #   * check-docs-coverage.sh fails when an action, entity or option exists in the
  #     integration but is not mentioned on its reference page. Crude string
  #     matching is enough: every gap this repository has shipped was "a new thing
  #     exists, the docs never mentioned it".
  #   * check-md-alerts.sh fails when a `> [!IMPORTANT]` marker is not alone on its
  #     line or not in a blockquote. GitHub reports nothing for either mistake, it
  #     just renders the marker as literal text — which is how the README's
  #     unofficial-project notice sat broken on the repository home page.
  #
  # Deliberately NOT added to `dev-release-main` or `dev-release` `needs`: a
  # skipped job propagates its skip to dependents that lack `if: always()`, which
  # is exactly how #171 stopped RC pre-releases from being cut for four merges.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_docs.txt

      - name: Build the docs, failing on broken links and anchors
        run: zensical build

      - name: Check every action, entity and option is documented
        run: bash scripts/check-docs-coverage.sh

      - name: Check GitHub alert syntax in Markdown
        run: bash scripts/check-md-alerts.sh

  conventional_commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint commit messages and PR title
        run: bash scripts/lint-commits.sh

  # Translation parity — fails when a non-English translation file under
  # custom_components/dimplex/translations/ is missing keys present in
  # en.json, or has keys that don't exist there. Reference language is
  # en.json; everything else must mirror its key shape.
  #
  # Catches drift like the v3.0.0-rc.16 issues/release translations that
  # were never back-ported to fr.json / nb.json.
  translations:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check translation key parity with en.json
        run: bash scripts/check-translation-parity.sh

  lint:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install ruff
        # Single source of truth for the ruff version. The lint job, the
        # pre-commit job and contributors all resolve it from here, so the
        # linter and formatter cannot disagree about what "correct" output is.
        run: pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Lint with ruff
        # --output-format=github emits ::error annotations inline on the offending
        # lines in the PR "Files changed" view.
        run: ruff check --output-format=github custom_components/ tests/

      - name: Check formatting
        run: ruff format --check custom_components/ tests/

  mypy:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_dev.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Type check with mypy
        run: mypy

  # Run the full pre-commit suite. The ruff hooks use the environment's ruff
  # (`language: system`), so the version installed here is the same one the lint
  # job and every contributor's dev venv use — one pin in requirements_test.txt
  # rather than a separate pre-commit mirror that could drift (#201).
  pre-commit:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install ruff
        # The ruff hooks run `ruff` from PATH.
        run: pip install "$(grep -E '^ruff==' requirements_test.txt)"

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant requires Python >=3.14, so that's the only supported
          # runtime for this integration.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Validate blueprints against Home Assistant's schema
        run: python scripts/check-blueprints.py

      - name: Run tests with coverage
        run: >-
          pytest tests/
          --cov=custom_components/dimplex --cov-branch
          --cov-report=xml --cov-report=term-missing
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  hacs_validate:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

  # Syntax-check the release / dev-build shell helpers. These scripts drive tag
  # computation, dev-version commits and HACS packaging, so a syntax error there can
  # break a release or leave a half-published pre-release. `bash -n` parses each script
  # without executing it — no external tooling, no network.
  scripts:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax-check shell scripts
        run: |
          shopt -s nullglob
          status=0
          for f in scripts/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n found a syntax error"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "One or more shell scripts failed syntax checking." >&2
          fi
          exit "$status"

  # Stable required status check for the `main` branch ruleset / protection.
  # - Component changes: fails unless translations, lint, mypy, pre-commit, test,
  #   hacs_validate, and scripts all succeed
  # - Docs/workflow-only changes: still succeeds (heavy jobs are skipped)
  # - Pull requests: also requires conventional_commits (always runs on PRs)
  #
  # Requiring individual path-filtered jobs on the branch (lint/test/hacs_validate)
  # blocked docs-only and release-please PRs when those jobs were skipped. A single
  # always-on `ci` gate stays green for non-component work while still blocking
  # bad component changes.
  ci:
    name: ci
    needs: [changes, conventional_commits, docs, translations, lint, mypy, pre-commit, test, hacs_validate, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required jobs
        run: |
          set -euo pipefail
          component="${{ needs.changes.outputs.component }}"
          docs="${{ needs.changes.outputs.docs }}"
          event_name="${{ github.event_name }}"
          echo "event: ${event_name}"
          echo "component changes: ${component}"
          echo "docs changes: ${docs}"
          echo "docs: ${{ needs.docs.result }}"
          echo "conventional_commits: ${{ needs.conventional_commits.result }}"
          echo "translations: ${{ needs.translations.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "mypy: ${{ needs.mypy.result }}"
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "hacs_validate: ${{ needs.hacs_validate.result }}"
          echo "scripts: ${{ needs.scripts.result }}"

          failed=0

          if [ "${event_name}" = "pull_request" ]; then
            if [ "${{ needs.conventional_commits.result }}" != "success" ]; then
              echo "::error::conventional_commits did not succeed (${{ needs.conventional_commits.result }})"
              failed=1
            fi
          fi

          if [ "${docs}" = "true" ] && [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::docs did not succeed (${{ needs.docs.result }})"
            failed=1
          fi

          if [ "${component}" != "true" ]; then
            if [ "${failed}" -eq 0 ]; then
              echo "No component paths changed — CI gate OK."
            fi
            exit "${failed}"
          fi

          for pair in \
            "translations:${{ needs.translations.result }}" \
            "lint:${{ needs.lint.result }}" \
            "mypy:${{ needs.mypy.result }}" \
            "pre-commit:${{ needs.pre-commit.result }}" \
            "test:${{ needs.test.result }}" \
            "hacs_validate:${{ needs.hacs_validate.result }}" \
            "scripts:${{ needs.scripts.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name} did not succeed (${result})"
              failed=1
            fi
          done
          exit "${failed}"

  # Branch dev builds — a same-repo PR that changed the component, once CI is green.
  # Fork PRs get a read-only token (release would fail) and this job holds
  # contents: write, so keep it to same-repo. Never for the release-please PR branch.
  #
  # Pre-releases use semver tags (vX.Y.Z-pr.P.R) pointing at a *synthetic* commit that
  # rewrites only manifest/const version files so HACS installs a version that sorts
  # above the last stable and below the eventual X.Y.Z. main is never mutated.
  #
  # Depends on the concrete jobs, NOT the aggregate `ci` gate. `ci` runs with
  # `if: always()` and needs `conventional_commits`, which is skipped on push — and
  # a skipped job in the needs graph skips everything downstream of it that does not
  # itself use always(). Gating on `ci` therefore silently stopped these builds from
  # ever running on main. See the note on dev-release-main.
  dev-release:
    needs: [changes, translations, lint, mypy, pre-commit, test, hacs_validate, scripts]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Immutable head SHA (the branch can be deleted by a racing merge), with
          # full history + tags for the changelog action.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/dimplex/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute dev version and tag
        id: tag
        env:
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
          # Include run_attempt so workflow re-runs mint a unique tag.
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/dimplex/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          WORKFLOW_EVENT=pull_request
          export VERSION HEAD_BRANCH PR_NUMBER SHORT_SHA RUN_ID WORKFLOW_EVENT
          mapfile -t _dev_kv < <(bash scripts/compute-dev-tag.sh)
          echo "${_dev_kv[0]}" >> "$GITHUB_OUTPUT" # version=
          echo "${_dev_kv[1]}" >> "$GITHUB_OUTPUT" # tag=
          echo "base_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        id: prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEV_VERSION: ${{ steps.tag.outputs.version }}
          BRANCH_RAW: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ steps.tag.outputs.base_sha }}
          BASE_VERSION: ${{ steps.tag.outputs.base_version }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ -z "${TAG}" ] || [ -z "${DEV_VERSION}" ]; then
            echo "BASE_SHA/TAG/DEV_VERSION empty; refusing to create an untargeted release."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Ensure main is available for the commit list (checkout may only have PR head).
          git fetch origin main --depth=50 2>/dev/null || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)
            object_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type' 2>/dev/null || true)
            if [ "$object_type" = "tag" ] && [ -n "$existing_sha" ]; then
              existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_sha}" --jq '.object.sha' 2>/dev/null || true)
            fi
            # Keep only if the synthetic commit's parent is this PR head (same base).
            parent=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${existing_sha}" --jq '.parents[0].sha' 2>/dev/null || true)
            if [ -n "$existing_sha" ] && [ "$parent" = "$BASE_SHA" ]; then
              echo "Release ${TAG} already built from ${BASE_SHA}; keeping ${existing_sha}."
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release ${TAG} exists (sha=${existing_sha:-unknown}); recreating."
            gh release delete "$TAG" --yes --cleanup-tag || true
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          fi

          git reset --hard "$BASE_SHA"
          SYNTHETIC_SHA=$(bash scripts/create-dev-version-commit.sh "$DEV_VERSION")
          export COMMIT_SHA="$SYNTHETIC_SHA"
          export TAG

          # Push the synthetic commit via the tag so gh can target it (not on main).
          git tag -f "$TAG" "$SYNTHETIC_SHA"
          git push origin "refs/tags/${TAG}"

          latest_stable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$latest_stable" ]; then
            stable_line="For everyday use, install the latest **stable** release instead: [\`${latest_stable}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${latest_stable})."
          else
            stable_line="No stable release has been published yet."
          fi

          short_sha=$(printf '%s' "$BASE_SHA" | cut -c1-7)
          {
            echo "> [!WARNING]"
            echo "> **This is an automated pre-merge development build, not an official release.**"
            echo "> It is built from PR [#${PR_NUMBER}](${PR_URL}) (\`${BRANCH_RAW}\`) at commit [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${BASE_SHA}) and may be unstable."
            echo "> Integration version in this tree: \`${DEV_VERSION}\` (semver pre-release; sorts above last stable, below final v${BASE_VERSION})."
            echo "> It is **not** a \`main\` release-candidate; do not treat it as production-ready."
            echo "> ${stable_line}"
            echo ""
            echo "## Pull request"
            echo ""
            echo "- **Title:** ${PR_TITLE}"
            echo "- **PR:** [#${PR_NUMBER}](${PR_URL})"
            echo "- **Branch:** \`${BRANCH_RAW}\`"
            echo "- **Base commit:** [\`${BASE_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${BASE_SHA})"
            echo "- **Release tree:** [\`${SYNTHETIC_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SYNTHETIC_SHA}) (version files only)"
            echo "- **Preview of:** upcoming **v${BASE_VERSION}** (after merge to \`main\`)"
            echo ""
            echo "## Commits on this branch"
            echo ""
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              git log --no-merges --pretty=format:'* %s ([%h](https://github.com/'"${GITHUB_REPOSITORY}"'/commit/%H))' \
                "origin/main..${BASE_SHA}"
              echo ""
            else
              echo "_Could not resolve \`origin/main\` for a commit list._"
            fi
          } > pr-dev-notes.md

          # HACS zip_release asset: contents of custom_components/dimplex only.
          bash scripts/package-hacs-zip.sh dimplex.zip

          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --target "$SYNTHETIC_SHA" \
            --notes-file pr-dev-notes.md \
            dimplex.zip

          bash scripts/verify-dev-release-target.sh
          echo "Created ${TAG} -> ${SYNTHETIC_SHA} (base ${BASE_SHA}, version ${DEV_VERSION})"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Label PR as dev-release-cut
        if: steps.prerelease.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -Fxq "dev-release-cut"; then
            gh label create "dev-release-cut" --repo "$GITHUB_REPOSITORY" \
              --color "5319e7" --description "A dev/RC pre-release was published for this PR" || true
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "dev-release-cut"

      # Each push to the PR mints a fresh vX.Y.Z-pr.<PR>.<run> build; the newest one
      # supersedes the rest. Prune the older builds for this PR now rather than leaving
      # them until the PR closes (cleanup-pr-release.yml) or the weekly sweep.
      - name: Prune superseded builds for this PR
        if: steps.prerelease.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KEEP_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Keeping ${KEEP_TAG}; pruning older pr.${PR_NUMBER} builds."
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
          | { grep -E "^v[0-9]+\\.[0-9]+\\.[0-9]+-pr\\.${PR_NUMBER}\\." || true; } \
          | while read -r tag; do
              if [ "$tag" = "$KEEP_TAG" ]; then
                continue
              fi
              echo "Deleting superseded PR pre-release: ${tag}"
              gh release delete "$tag" --yes --cleanup-tag || true
            done

  # Main release-candidate dev builds — a push to main that changed the component,
  # once CI is green. Never for the release-please commit, whose subject is
  # "chore(main): release X.Y.Z".
  #
  # Tags are vX.Y.Z-rc.N on a synthetic version commit (version files only).
  # We do not force-push a moving `dev` branch: those commits are unsigned bot
  # commits and conflict with "Commits must have verified signatures" rules.
  # Install RCs via the prerelease tag / HACS instead. main is never mutated.
  #
  # Two things here are load-bearing and easy to break:
  #
  # 1. Depend on the real jobs, not the aggregate `ci` gate. `ci` needs
  #    `conventional_commits`, which only runs on pull_request; on a push to main
  #    that job is skipped, and the skip propagates through `ci` (which survives it
  #    via `if: always()`) to skip this job before its `if` is consulted. No RC was
  #    ever cut from main for that reason.
  # 2. Match the release-please commit on its *subject*, with startsWith. A
  #    `contains` test against the whole message also matches any commit whose body
  #    merely mentions the release-commit prefix — including a commit describing
  #    this very guard, which is how it was found.
  dev-release-main:
    needs: [changes, translations, lint, mypy, pre-commit, test, hacs_validate, scripts]
    if: >-
      needs.changes.outputs.component == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: nextver
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ github.token }}
          version-file: custom_components/dimplex/manifest.json
          version-path: version
          tag-prefix: v
          preset: conventionalcommits
          skip-on-empty: true
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false
          output-file: false

      - name: Compute base version and RC number
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.nextver.outputs.skipped }}
          NEXT_VERSION: ${{ steps.nextver.outputs.version }}
        run: |
          if [ "$SKIPPED" = "true" ] || [ -z "$NEXT_VERSION" ]; then
            VERSION=$(jq -r .version custom_components/dimplex/manifest.json)
          else
            VERSION="$NEXT_VERSION"
          fi
          # If this version is already fully released, remove leftover RC pre-releases
          # (new vX.Y.Z-rc.N and legacy dev-vX.Y.Z-rc.N) and skip creating a new RC.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Full release v${VERSION} exists; deleting matching RC pre-releases."
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E "^(dev-)?v${VERSION}-rc\\.[0-9]+$" || true; } \
            | while read -r tag; do
                echo "Deleting stale RC pre-release: ${tag}"
                gh release delete "$tag" --yes --cleanup-tag || true
              done
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Next RC: max(releases, git tags) + 1. Tags matter because deleting an
          # *immutable* GitHub release still reserves the tag name.
          RC_NUMBER=$(bash scripts/next-main-rc-number.sh "${VERSION}")
          HEAD_BRANCH=main
          WORKFLOW_EVENT=push
          export VERSION RC_NUMBER HEAD_BRANCH WORKFLOW_EVENT
          mapfile -t _dev_kv < <(bash scripts/compute-dev-tag.sh)
          echo "${_dev_kv[0]}" >> "$GITHUB_OUTPUT" # version=
          echo "${_dev_kv[1]}" >> "$GITHUB_OUTPUT" # tag=
          echo "base_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "rc_number=${RC_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Next main RC candidate: ${_dev_kv[1]#tag=}"

      - name: Prune superseded main RC pre-releases
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.base_version }}
        run: |
          # Keep RC builds only for the *current* next-version (new + legacy tag shapes).
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
          | { grep -E '^(dev-)?v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' || true; } \
          | while read -r tag; do
              bare="${tag#dev-}"
              bare="${bare#v}"
              tag_version="${bare%-rc*}"
              if [ "$tag_version" != "$VERSION" ]; then
                echo "Deleting superseded RC pre-release: ${tag} (version ${tag_version} != ${VERSION})"
                gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done

      - name: Create pre-release
        id: create
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEV_VERSION: ${{ steps.tag.outputs.version }}
          BASE_VERSION: ${{ steps.tag.outputs.base_version }}
          BASE_SHA: ${{ steps.tag.outputs.base_sha }}
          RC_NUMBER: ${{ steps.tag.outputs.rc_number }}
          CHANGELOG: ${{ steps.nextver.outputs.clean_changelog }}
        run: |
          set -euo pipefail
          latest_stable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$latest_stable" ]; then
            stable_line="For everyday use, install the latest **stable** release instead: [\`${latest_stable}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${latest_stable})."
          else
            stable_line="No stable release has been published yet."
          fi

          max_attempts=25
          attempt=0
          while [ "${attempt}" -lt "${max_attempts}" ]; do
            attempt=$((attempt + 1))
            # Recompute tag/version from RC_NUMBER each attempt.
            VERSION="$BASE_VERSION"
            HEAD_BRANCH=main
            WORKFLOW_EVENT=push
            export VERSION RC_NUMBER HEAD_BRANCH WORKFLOW_EVENT
            mapfile -t _dev_kv < <(bash scripts/compute-dev-tag.sh)
            DEV_VERSION="${_dev_kv[0]#version=}"
            TAG="${_dev_kv[1]#tag=}"
            export TAG DEV_VERSION

            if gh release view "$TAG" >/dev/null 2>&1; then
              existing_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)
              object_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type' 2>/dev/null || true)
              if [ "$object_type" = "tag" ] && [ -n "$existing_target" ]; then
                existing_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_target}" --jq '.object.sha' 2>/dev/null || true)
              fi
              parent=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${existing_target}" --jq '.parents[0].sha' 2>/dev/null || true)
              if [ -n "$existing_target" ] && [ "$parent" = "$BASE_SHA" ]; then
                echo "Release ${TAG} already built from ${BASE_SHA}; keeping."
                echo "created_tag=${TAG}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Release/tag ${TAG} exists (target ${existing_target:-unknown}); rolling over."
              RC_NUMBER=$((RC_NUMBER + 1))
              continue
            fi

            git reset --hard "$BASE_SHA"
            SYNTHETIC_SHA=$(bash scripts/create-dev-version-commit.sh "$DEV_VERSION")
            export COMMIT_SHA="$SYNTHETIC_SHA"

            {
              echo "> [!WARNING]"
              echo "> **This is an automated release-candidate build, not an official release.**"
              echo "> It previews the upcoming **v${BASE_VERSION}** release from \`main\` (base commit \`${BASE_SHA}\`) and may be unstable."
              echo "> Integration version in this tree: \`${DEV_VERSION}\` (semver pre-release)."
              echo "> ${stable_line}"
              echo ""
              echo "## What's changed for v${BASE_VERSION}"
              echo ""
              if [ -n "${CHANGELOG}" ]; then
                printf '%s\n' "${CHANGELOG}"
              else
                echo "_No user-facing changes detected since the last release._"
              fi
            } > rc-notes.md

            git tag -f "$TAG" "$SYNTHETIC_SHA"
            set +e
            push_out=$(git push origin "refs/tags/${TAG}" 2>&1)
            push_status=$?
            set -e
            if [ "${push_status}" -ne 0 ]; then
              echo "git push tag failed for ${TAG} (attempt ${attempt}):"
              printf '%s\n' "${push_out}"
              if printf '%s\n' "${push_out}" | grep -qiE 'already exists|rejected|cannot lock'; then
                RC_NUMBER=$((RC_NUMBER + 1))
                echo "Tag push collision; next RC_NUMBER=${RC_NUMBER}"
                continue
              fi
              exit "${push_status}"
            fi

            # HACS zip_release asset: package from the synthetic tree (version files set).
            bash scripts/package-hacs-zip.sh dimplex.zip

            set +e
            create_out=$(gh release create "$TAG" \
              --prerelease \
              --title "$TAG" \
              --target "$SYNTHETIC_SHA" \
              --notes-file rc-notes.md \
              dimplex.zip 2>&1)
            create_status=$?
            set -e
            if [ "${create_status}" -eq 0 ]; then
              export TAG COMMIT_SHA
              bash scripts/verify-dev-release-target.sh
              echo "Created ${TAG} -> ${SYNTHETIC_SHA} (base ${BASE_SHA}, version ${DEV_VERSION})"
              # Publish the tag actually created (RC_NUMBER may have rolled over on
              # collision) so the follow-up prune keeps the right one.
              echo "created_tag=${TAG}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "gh release create failed for ${TAG} (attempt ${attempt}):"
            printf '%s\n' "${create_out}"
            if ! printf '%s\n' "${create_out}" | grep -qiE \
              'already exists|immutable|Validation Failed|Reference already exists|tag_name was used|Unprocessable Entity|HTTP 422'; then
              exit "${create_status}"
            fi
            echo "Tag collision / immutable reservation for ${TAG}; rolling over."
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
            RC_NUMBER=$((RC_NUMBER + 1))
          done
          echo "Exhausted ${max_attempts} RC tag attempts without creating a release." >&2
          exit 1

      # The RC just created supersedes every earlier RC of the same version line, so
      # prune them immediately instead of leaving the long tail for the weekly sweep.
      # Cross-version RCs were already pruned before creation; this keeps only the
      # newest RC of the current line (new vX.Y.Z-rc.N and legacy dev-vX.Y.Z-rc.N).
      - name: Prune superseded RCs of this version line
        if: ${{ steps.tag.outputs.skip != 'true' && steps.create.outputs.created_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.base_version }}
          KEEP_TAG: ${{ steps.create.outputs.created_tag }}
        run: |
          echo "Keeping ${KEEP_TAG}; pruning older RCs of v${VERSION}."
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
          | { grep -E "^(dev-)?v${VERSION}-rc\\.[0-9]+$" || true; } \
          | while read -r tag; do
              if [ "$tag" = "$KEEP_TAG" ]; then
                continue
              fi
              echo "Deleting superseded RC pre-release: ${tag}"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
