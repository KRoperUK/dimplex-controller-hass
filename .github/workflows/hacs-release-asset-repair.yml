name: HACS release asset repair

# Repair tool, not automation. release-please builds and verifies dimplex.zip
# inline (release-please.yaml), so every published release already carries the
# asset HACS zip_release installs from.
#
# It used to trigger on `release: [published]`, which never fired: GitHub does not
# raise workflow events for releases created with the automatic `github.token`,
# and release-please creates them with exactly that. The last run was v4.0.1
# (2026-07-17) while v4.0.2 and every September RC published with no run at all.
# The trigger is gone rather than duplicated, so a missing asset is attached
# deliberately by hand (dimplex-controller-hass#201).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)attach dimplex.zip to
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Build and upload dimplex.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/package-hacs-zip.sh dimplex.zip

          # Check if the release is immutable — if so, skip the upload gracefully.
          is_immutable=$(gh api "repos/{owner}/{repo}/releases/tags/${TAG}" --jq '.assets // [] | length' 2>/dev/null || echo "0")

          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq dimplex.zip; then
            echo "dimplex.zip already present on ${TAG}; attempting replace"
            gh release delete-asset "$TAG" dimplex.zip --yes || {
              echo "::warning::Cannot replace dimplex.zip on ${TAG} (release may be immutable). Skipping."
              exit 0
            }
          fi
          gh release upload "$TAG" dimplex.zip --clobber
          echo "Attached dimplex.zip to ${TAG}"

      - name: Verify the replacement asset is installable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # This workflow exists to fix a bad asset, so check the replacement rather than
          # assuming the repair worked — the local build is not what HACS downloads.
          gh release download "$TAG" --pattern dimplex.zip --dir repaired --clobber
          bash scripts/test-hacs-zip.sh repaired/dimplex.zip
          echo "Verified the dimplex.zip now published on ${TAG} is installable."
