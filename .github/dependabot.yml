version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      # Must match labels.yml. `github-actions` (hyphen) is not a label that
      # exists, so GitHub silently dropped it from every github-actions PR.
      - github_actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keeps the pre-commit hook revisions current — prettier and the
  # pre-commit-hooks set. Safe to add now that ruff is not pinned here: it runs
  # from requirements_test.txt, so a hook bump can never half-update the version
  # the linter actually uses (#201).
  #
  # `dependencies` only: there is no `pre-commit` label in labels.yml, and GitHub
  # drops a label that does not exist without reporting it.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Bundle low-risk minor/patch bumps into a single PR; majors stay separate
      # so they get individual review.
      python-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          # The Home Assistant pair moves in its own PR, for two reasons. They are
          # not low-risk: pytest-homeassistant-custom-component pins an exact
          # `homeassistant==` build, so the two must move together for the
          # resolution to be satisfiable (see requirements_dev.txt), and a Home
          # Assistant typing change can fail `mypy` on its own. #261 grouped an HA
          # bump with ruff and zensical, and that mypy failure blocked all four —
          # including two bumps with nothing to do with Home Assistant.
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
        update-types:
          - minor
          - patch
      homeassistant-stack:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
        update-types:
          - minor
          - patch
