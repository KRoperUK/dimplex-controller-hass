default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        # HA blueprints use !input tags that are not plain YAML.
        exclude: ^blueprints/
      - id: check-json
        # VS Code config files are JSONC (allow comments/trailing commas).
        exclude: ^\.vscode/
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ruff runs from the environment, like the mypy/pytest hooks below, so
  # requirements_test.txt is the single source of truth for its version.
  #
  # It used to be pinned twice — here via ruff-pre-commit's `rev:`, and in
  # requirements_test.txt — with scripts/check-ruff-pin.sh holding the two
  # together. That coupling was deliberate, but it meant dependabot could only
  # ever bump one side, so every ruff bump PR failed the pin check and could not
  # merge; #162 was red for exactly that reason and had to be superseded (#201).
  # One pin, and the problem cannot occur. Requires ruff on PATH: the dev venv
  # (requirements_test.txt) provides it, and CI installs it before running the
  # hooks.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, --fix)
        entry: ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
  - repo: local
    hooks:
      # Canonicalise HA manifests (domain/name first, then alpha; indent=2).
      # Must match release-please's JSON rewriter so release PRs stay green.
      # Prettier deliberately skips these files — see .prettierignore.
      - id: format-ha-manifest
        name: format Home Assistant manifest.json
        entry: python3 scripts/format_manifest.py
        language: system
        files: ^custom_components/[^/]+/manifest\.json$
        pass_filenames: true
  # pre-commit/mirrors-prettier is archived (last release April 2024) and its
  # newest published rev pinned Prettier 2.2.1 — which predates GitHub alerts
  # and silently mangles them: `> [!IMPORTANT]` followed by text gets joined
  # into `> [!IMPORTANT] > text`, so the callout renders as literal characters
  # in a plain blockquote. That is how the README's unofficial-project notice
  # shipped broken in #182. rbubley's mirror is the maintained successor.
  # scripts/check-md-alerts.sh guards the syntax regardless of formatter.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
  # CI-parity gates that need the project's test environment (homeassistant +
  # requirements_test.txt). Run at the pre-push stage so ordinary commits stay
  # fast; `pre-commit run --all-files` in CI (commit stage) skips these, while
  # the dedicated CI mypy/test jobs still enforce them. Requires the dev venv
  # (or an env with requirements_test.txt installed) on PATH.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check — mirrors CI mypy job)
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest with coverage (mirrors CI test job)
        entry: pytest tests/ --cov-branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
