blueprint:
  name: Dimplex away when everyone leaves
  description: >-
    Engage the climate `away` preset when a person or presence group stops being
    home.

    Away holds a settable setback target until you clear it — the appliance away
    temperature when known, capped at the 18 °C the Dimplex cloud accepts. It is
    not frost protection, which is fixed at 7 °C.

    This blueprint only engages away. It does not clear it when you return, so
    pair it with a second automation selecting the `comfort` preset, or clear it
    by hand. See https://dimplex-hass.kroper.uk/use/modes/
  domain: automation
  homeassistant:
    min_version: "2026.9.0"
  input:
    presence_entity:
      name: Person or presence group
      description: Away engages when this entity leaves the `home` state.
      selector:
        entity:
    climate_entity:
      name: Dimplex climate entity
      selector:
        entity:
          domain: climate
          integration: dimplex

triggers:
  - trigger: state
    entity_id: !input presence_entity
    to: "not_home"

actions:
  - action: climate.set_preset_mode
    target:
      entity_id: !input climate_entity
    data:
      preset_mode: away

mode: single
