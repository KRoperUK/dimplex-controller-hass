blueprint:
  name: Dimplex boost if room is cold
  description: >-
    Engage the climate `boost` preset when a room temperature sensor falls below
    a threshold, within a time window.

    Boost runs for the duration set in the integration options — 60 minutes by
    default — and then hands back to the schedule. For explicit control over the
    target and duration, use the `dimplex.set_boost` action instead. See
    https://dimplex-hass.kroper.uk/reference/actions/

    On charge-based storage heaters a boost may have no visible effect until
    there is stored charge to release. See
    https://dimplex-hass.kroper.uk/reference/appliances/
  domain: automation
  homeassistant:
    min_version: "2025.1.0"
  input:
    temperature_sensor:
      name: Room temperature sensor
      description: >-
        Usually the Dimplex "Room temperature" sensor for the same appliance, but
        any temperature sensor works.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    climate_entity:
      name: Dimplex climate entity
      selector:
        entity:
          domain: climate
          integration: dimplex
    threshold:
      name: Temperature threshold (°C)
      description: Boost engages when the sensor drops below this.
      default: 17
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    after:
      name: Active after
      description: >-
        Without a time window a cold night triggers a boost in the small hours.
      default: "06:00:00"
      selector:
        time:
    before:
      name: Active before
      default: "22:00:00"
      selector:
        time:

triggers:
  - trigger: numeric_state
    entity_id: !input temperature_sensor
    below: !input threshold

conditions:
  - condition: time
    after: !input after
    before: !input before

actions:
  - action: climate.set_preset_mode
    target:
      entity_id: !input climate_entity
    data:
      preset_mode: boost

mode: single
