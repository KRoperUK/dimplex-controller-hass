set_boost:
  name: Set boost
  description: Enable boost for a Dimplex appliance.
  fields:
    device_id:
      name: Device
      description: Appliance device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      description: Any entity belonging to the appliance
      selector:
        entity:
          integration: dimplex
    temperature:
      name: Temperature
      description: Boost target temperature (°C)
      default: 25
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Duration
      description: Boost duration in minutes
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min

clear_boost:
  name: Clear boost
  description: Disable boost for a Dimplex appliance.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    temperature:
      name: Temperature
      default: 25
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

set_away:
  name: Set away
  description: >-
    Enable away mode for a Dimplex appliance. Away holds a settable setback
    target (7-18 °C) until the date you give it — unlike frost protection, which
    is always 7 °C.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    temperature:
      name: Temperature
      description: >-
        Away setback target. Defaults to 16 °C. The cloud accepts 7-18 °C for Away —
        lower than the 7-30 °C available for a normal setpoint — and silently reduces
        anything higher, so values above 18 are clamped here with a warning.
      default: 16
      selector:
        number:
          min: 7
          max: 18
          step: 0.5
          unit_of_measurement: "°C"
    days:
      name: Days
      description: >-
        How many days to stay away. Ignored when "Until" is given. Leave both
        empty for an open-ended away.
      selector:
        number:
          min: 1
          max: 365
          step: 1
          unit_of_measurement: days
    until:
      name: Until
      description: Exact moment to come back. Takes precedence over "Days".
      selector:
        datetime:

clear_away:
  name: Clear away
  description: Disable away mode for a Dimplex appliance.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    temperature:
      name: Temperature
      description: Accompanies the clear; the cloud accepts 7-18 °C for Away.
      default: 16
      selector:
        number:
          min: 7
          max: 18
          step: 0.5
          unit_of_measurement: "°C"

set_advance:
  name: Advance
  description: >-
    Skip forward to the next schedule period, bringing the next comfort setpoint
    on early. Leave the temperature empty to follow the schedule's own target,
    which is what the official app does for Quantum and storage heaters.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    temperature:
      name: Temperature
      description: Optional explicit target to advance to.
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

clear_advance:
  name: Cancel advance
  description: Cancel an active advance and return to the schedule.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex

set_eco_start:
  name: Set EcoStart
  description: Enable or disable EcoStart.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    enable:
      name: Enable
      default: true
      selector:
        boolean:

set_open_window_detection:
  name: Set open window detection
  description: Enable or disable open-window detection.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    enable:
      name: Enable
      default: true
      selector:
        boolean:

copy_schedule:
  name: Copy schedule
  description: >-
    Apply one appliance's weekly programme to other appliances on the same hub. The
    source appliance's timer mode is copied with it, so the targets end up in the
    same mode rather than only holding the same periods.
  fields:
    device_id:
      name: Source device
      description: The appliance whose schedule is copied.
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Source entity
      description: Any entity belonging to the appliance whose schedule is copied.
      selector:
        entity:
          integration: dimplex
    target_device_ids:
      name: Target devices
      description: Appliances to receive the schedule. Must be on the same hub as the source.
      required: true
      selector:
        device:
          integration: dimplex
          multiple: true

set_period_setpoint:
  name: Set schedule period setpoint
  description: >-
    Change one existing schedule period's target temperature, without rewriting the
    rest of the programme. Matches on day and start time, so the period has to
    already exist — see the appliance's Schedule sensor for its periods.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: dimplex
    entity_id:
      name: Entity
      selector:
        entity:
          integration: dimplex
    day:
      name: Day
      description: Day of the week the period belongs to.
      required: true
      selector:
        select:
          options:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
    start_time:
      name: Start time
      description: Start time of the period to edit, exactly as the Schedule sensor lists it.
      required: true
      selector:
        time:
    temperature:
      name: Temperature
      description: New target temperature for that period (°C).
      required: true
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    end_time:
      name: End time
      description: Optional new end time for the period.
      selector:
        time:
